[project]
name = "yige-assessment"
version = "0.1.0"
description = "Inventory ledger, fulfilment optimiser, Xero review and variant PDP"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["A/tests", "B/tests", "app/backend/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
